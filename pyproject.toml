[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apsgo-scheduler"
version = "0.1.0.dev0"
description = "Rule-driven path-cover and deterministic local-search scheduler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128,<0.129",
    "uvicorn>=0.40,<0.41",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pytest>=8.4,<9", "ruff>=0.11"]

[project.scripts]
apsgo-v7-rule-service = "apsgo_v7_service.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "apsgo_scheduler",
    "apsgo_scheduler.*",
    "apsgo_v7_service",
    "apsgo_v7_service.*",
]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
